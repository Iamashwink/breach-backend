services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-breachpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-breachpoint}
      POSTGRES_DB: ${POSTGRES_DB:-breachpoint}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-breachpoint}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-breachpoint}:${POSTGRES_PASSWORD:-breachpoint}@postgres:5432/${POSTGRES_DB:-breachpoint}
      AUTO_SEED: ${AUTO_SEED:-true}
      AUTO_PUBLISH: ${AUTO_PUBLISH:-true}
      EVENT_HOURS: ${EVENT_HOURS:-48}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
      - ./entrypoint.sh:/app/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
